# Render Blueprint — the FastAPI console only.
#
# The LiveKit voice worker is deliberately NOT here. Render's free instance
# spins down after 15 minutes without inbound traffic, and a spun-down worker
# is deregistered from LiveKit: a caller dials in and hears silence. It is also
# 512 MB / 0.1 CPU, against ~400 MiB idle and real-time audio. Run the worker
# with `make agent`, or on an always-on host, and point it at the same LiveKit
# project — the two find each other through LiveKit, not through Render.
#
# What this service DOES give you: the browser test console at /, the lead
# viewer at /admin, and POST /api/livekit/token. Note the console's audio is
# the browser's Web Speech API, so it exercises the workflow, not the OpenAI
# voice models.
#
# Leads written here are LOST on every restart and deploy — free instances
# cannot attach a disk. Fine for a demo; not a place to collect real leads.

services:
  - type: web
    name: local-mama-console
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # closest Render region to Indian users
    healthCheckPath: /health
    # Overrides the image's CMD, which would also start the voice worker.
    dockerCommand: python -m backend.app.main
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: STT_PROVIDER # the browser path supplies its own audio;
        value: mock # no vendor key needed for this service
      - key: TTS_PROVIDER
        value: mock
      # Set in the Render dashboard (Environment → Add Secret), never here.
      # Only needed for POST /api/livekit/token to work.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Salts the caller-profile hashes. Any stable random string.
      - key: PROFILE_SALT
        sync: false
