# Cron-only blueprint — the outbox sweep, without the web service.
#
# This is NOT the full deployment. The API that the agent calls is absent, so
# nothing new is recorded while this is all that runs; the sweep will find an
# empty backlog every five minutes. It exists to bring the sweep up on its own.
#
# The env list is inline rather than anchored, because the anchor it used lived
# on the web service in the real render.yaml.

services:
  - type: cron
    name: localmama-outbox
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    schedule: "*/5 * * * *"
    dockerCommand: python -m backend.outbox_worker --once
    envVars:
      - key: DATABASE_URL
        sync: false                # Neon DSN — same one the deleted stack used
      - key: SARVAM_API_KEY
        sync: false
      - key: WHATSAPP_ENABLED
        value: "1"
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: BRAIN_OWNER_ID
        value: localmama
      - key: BRAIN_AGENT_ID
        value: localmama
      # Read by the recovery path: `reprocess()` runs the full pipeline for any
      # lead that ended without being processed, and that path flags fields.
      - key: REVIEW_THRESHOLD
        value: "0.75"
      - key: TRANSCRIPT_RETENTION_DAYS
        value: "30"
      - key: TURN_RETENTION_DAYS
        value: "90"
      - key: LOG_LEVEL
        value: INFO
      # AGENT_TOKEN and OPS_TOKEN are deliberately absent: both gate HTTP
      # surfaces, and a cron job serves none. Minting them here would create
      # two secrets that authorise nothing and drift from the real ones.
