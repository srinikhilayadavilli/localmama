# Render blueprint for the Local Mama lead backend.
#
# A web service and a cron job off one image. They are separated because their
# failure modes are different: the API must stay responsive for the agent, and
# the sweep does slow, retry-heavy work against a provider that is sometimes
# down for hours. Inside the agent these shared a process with a live phone
# call.
#
# The sweep is a cron job rather than a background worker because it is not a
# daemon — it is one pass on a timer, and it already exits cleanly after one.
# An always-on worker bills by the month and holds a Neon connection pool
# around the clock to sleep in; a cron job bills by the second and holds one
# for the few seconds a pass takes.
#
# The agent itself is NOT here — it deploys to LiveKit Cloud.

services:
  - type: web
    name: localmama-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore              # nearest Render region to ap-south LiveKit
    plan: starter
    healthCheckPath: /healthz
    # Once per deploy, by one process — not lazily from inside a request.
    preDeployCommand: python -m backend.migrate
    envVars: &backend_env
      - key: DATABASE_URL
        sync: false                # Neon DSN
      - key: AGENT_TOKEN
        generateValue: true        # the agent presents this as a bearer token
      - key: SARVAM_API_KEY
        sync: false
      - key: WHATSAPP_ENABLED
        value: "1"
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: BRAIN_OWNER_ID
        value: localmama
      - key: BRAIN_AGENT_ID
        value: localmama
      - key: REVIEW_THRESHOLD
        value: "0.75"
      - key: TRANSCRIPT_RETENTION_DAYS
        value: "30"
      # Gates /metrics and /v1/ops/* — the unit economics. A separate secret
      # from AGENT_TOKEN because they are different principals: the agent files
      # leads, a scraper reads aggregates, and rotating one must not silence
      # the other. Unset refuses the ops surface rather than opening it.
      - key: OPS_TOKEN
        generateValue: true
      # Display only. Every stored price is USD, because that is what providers
      # bill in; nothing stored is ever converted, so moving this cannot
      # restate history.
      - key: INR_PER_USD
        value: "88"
      # The per-response turn series is the largest thing the observability
      # schema writes and its value is diagnostic, which decays in days. The
      # usage ledger itself is never swept — it is the billing record.
      - key: TURN_RETENTION_DAYS
        value: "90"
      - key: LOG_LEVEL
        value: INFO

  - type: cron
    # Not `localmama-outbox`: that name belonged to the background worker this
    # replaces, and for a while both existed, suspended, distinguishable only
    # by a type badge in a list. An unreadable service list is a service list
    # someone deletes to clear up. The cadence is in the name because the
    # schedule below is the only place it is otherwise written down.
    name: localmama-sweep-5m
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    # The instance size a run executes at, not a monthly reservation: a cron
    # job is billed for the seconds it runs.
    plan: starter
    # The deployed sweep interval. `OUTBOX_SWEEP_SECONDS` still drives the
    # `forever()` loop for local runs; in production this schedule is the
    # interval, so the two are kept at the same five minutes deliberately.
    schedule: "*/5 * * * *"
    # `--once` and not the daemon: Render starts the container per run.
    # Overlapping runs are safe anyway — owed rows are claimed with
    # `FOR UPDATE SKIP LOCKED`, so two passes take disjoint batches rather
    # than sending one customer the same message twice.
    dockerCommand: python -m backend.outbox_worker --once
    envVars: *backend_env
